[project]
name = "omniassist-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.143.1",
  "uvicorn>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.32.0",
  "alembic>=1.20.0",
  "pyjwt[crypto]>=2.15.1",
  "httpx>=0.28.1",
  "pywebpush>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "psycopg[binary]>=3.3.6",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pywebpush", "py_vapid"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
